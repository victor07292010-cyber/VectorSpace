name: Publish VectorSpace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test private room protocol
        run: node tools/check-rooms.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build the offline download
        run: node tools/build-offline.cjs
      - name: Package games
        uses: actions/upload-pages-artifact@v4
        with:
          path: game-night
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
